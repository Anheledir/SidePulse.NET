name: Feature or compatibility request
description: Propose a feature or an upstream behavior to port.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: User goal
      description: What should become possible?
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream behavior
      description: Link source documentation or a reference revision if applicable.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, including offline and failure cases.
    validations:
      required: true
