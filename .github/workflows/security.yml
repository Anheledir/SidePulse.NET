name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build C# for analysis
        if: matrix.language == 'csharp'
        run: |
          dotnet restore --locked-mode
          dotnet build --configuration Release --no-restore --no-incremental
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
      - name: Summarize scan findings
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          for report in sorted(Path('codeql-results').glob('*.sarif')):
              for run in json.loads(report.read_text()).get('runs', []):
                  for result in run.get('results', []):
                      locations = [item.get('physicalLocation', {}) for item in result.get('locations', [])]
                      print(json.dumps({'rule': result.get('ruleId'), 'message': result.get('message'), 'locations': locations}))
          PYCODE
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
