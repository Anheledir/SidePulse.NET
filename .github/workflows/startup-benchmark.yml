name: Startup benchmark
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.*'
      - 'scripts/benchmark_startup.py'
      - '.github/workflows/startup-benchmark.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or tag to publish with the same SDK
        required: true
        default: 26f64b9f864348e51684bf68f49095f151a3ba27
permissions:
  contents: read
concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: baseline
          ref: ${{ inputs.baseline_ref || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Publish and compare isolated native bundles
        shell: pwsh
        run: |
          $prefix = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $rid = "$prefix-$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant())"
          $binary = if ($IsWindows) { 'spn.exe' } else { 'spn' }
          dotnet --info > sdk-info.txt
          foreach ($source in @('baseline', 'candidate')) {
            dotnet publish "$source/src/SidePulse.Cli" -c Release -r $rid --self-contained true -p:NuGetLockFilePath=obj/packages.publish.lock.json -o "$source/published"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $before = git -C baseline rev-parse HEAD
          $after = git -C candidate rev-parse HEAD
          python candidate/scripts/benchmark_startup.py "baseline/published/$binary" --samples 9 --label $before --output baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python candidate/scripts/benchmark_startup.py "candidate/published/$binary" --samples 9 --label $after --output candidate.json --compare baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload measurements and build environment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-${{ runner.os }}
          path: |
            baseline.json
            candidate.json
            sdk-info.txt
          retention-days: 30
