name: .NET CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      solution: ${{ steps.detect.outputs.solution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: detect
        name: Detect application solution
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          solutions = sorted(list(Path('.').glob('*.slnx')) + list(Path('.').glob('*.sln')))
          if len(solutions) > 1:
              raise SystemExit('Expected one root-level solution; update the workflow for multiple solutions.')
          solution = str(solutions[0]) if solutions else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'solution={solution}\n')
          if not solution:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Concept phase: no solution exists. Build/test jobs are intentionally skipped.\n')
          PY
  build:
    needs: detect
    if: needs.detect.outputs.solution != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        env:
          SOLUTION: ${{ needs.detect.outputs.solution }}
        shell: pwsh
        run: dotnet restore $env:SOLUTION --locked-mode
      - name: Build
        env:
          SOLUTION: ${{ needs.detect.outputs.solution }}
        shell: pwsh
        run: dotnet build $env:SOLUTION --configuration Release --no-restore
      - name: Test
        env:
          SOLUTION: ${{ needs.detect.outputs.solution }}
        shell: pwsh
        run: dotnet test $env:SOLUTION --configuration Release --no-build
      - name: Exercise CLI and local host with simulated hardware
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'sidepulse-net.exe' } else { 'sidepulse-net' }
          python scripts/cli_smoke.py "src/SidePulse.Cli/bin/Release/net10.0/$binary"
      - name: Publish self-contained Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/SidePulse.Cli -c Release -r win-x64 --self-contained true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,NOTICE.md artifacts/win-x64
          New-Item -ItemType Directory -Force artifacts/win-x64/third-party/dotnet | Out-Null
          Copy-Item "$env:DOTNET_ROOT/LICENSE.txt","$env:DOTNET_ROOT/ThirdPartyNotices.txt" artifacts/win-x64/third-party/dotnet
          Copy-Item -Recurse third-party artifacts/win-x64
          Copy-Item docs/wiki/Getting-Started.md artifacts/win-x64
          python scripts/cli_smoke.py artifacts/win-x64/sidepulse-net.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidepulse-net-win-x64-preview
          path: artifacts/win-x64/
          retention-days: 14
